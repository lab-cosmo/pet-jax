[tox]
requires =
    tox>=4
    tox-uv>=1
env_list = lint, tests

# tox-uv automatically enables uv-based environment creation and dependency
# resolution when installed alongside tox. No explicit runner setting needed.

[testenv:lint]
description = ruff check + format check
skip_install = true
deps =
    ruff>=0.15
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

[testenv:tests]
description = run the pytest test suite
deps =
    pytest>=8.0
commands =
    pytest tests/ {posargs:-x -v}

[testenv:fetch-checkpoints]
description = fetch + convert the reference checkpoints for tests
extras = convert
deps =
    # Floor prevents uv from backtracking past the real releases onto the
    # broken metatrain==0.0.0 placeholder sdist when resolving the overlay.
    metatrain>=2026.3
commands =
    # Both PET-MAD releases: v1.6 renamed the direct-force readout target, so
    # the mini suite runs against one checkpoint of each spelling.
    petjax-convert pet-mad-xs --version 1.5.0 --out tests/assets/checkpoints/pet-mad-xs
    petjax-convert pet-mad-xs --version 1.6.0 --out tests/assets/checkpoints/pet-mad-xs-v1.6
    petjax-convert pet-omat-xs-v1.0.0 --out tests/assets/checkpoints/pet-omat-xs
