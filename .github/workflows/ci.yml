name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install tox
        run: uv tool install --with tox-uv tox
      - name: Lint (ruff)
        run: tox -e lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install tox
        run: uv tool install --with tox-uv tox
      # The converted reference checkpoints depend only on the checkpoint list
      # in tox.ini and on the converter itself; keyed on those, a hit skips the
      # ~180 MB of downloads and the torch-side conversion.
      - name: Cache converted checkpoints
        id: checkpoints
        uses: actions/cache@v4
        with:
          path: tests/assets/checkpoints
          key: checkpoints-${{ hashFiles('tox.ini', 'src/petjax/convert.py', 'src/petjax/cli.py') }}
      - name: Fetch + convert reference checkpoints
        if: steps.checkpoints.outputs.cache-hit != 'true'
        run: tox -e fetch-checkpoints
      - name: Tests (pytest)
        run: tox -e tests
